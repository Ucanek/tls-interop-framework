syntax = "proto3";

package tls.interop;

// Test role (client or server)
enum Role {
  ROLE_UNSPECIFIED = 0;
  CLIENT = 1;
  SERVER = 2;
}

// Capability filter flags
enum ModifyFlag {
  UNSUPPORTED = 0;
  READ = 1;
  SET = 2;
  NEGOTIATE = 4;
}

// --- Dispatcher / capability messages ---

message Capability {
  string name = 1;
  repeated ModifyFlag flags = 2;
}

message LibraryMetadata {
  string component_name = 1;
  string version = 2;
  repeated Role roles = 3;
  repeated Capability supported_versions = 4;
  repeated Capability cipher_suites = 5;
  repeated Capability groups = 6;
}

// --- Coordinator / operation messages ---
//
// TlsConfig aligns with CLI catalog ids (capabilities.json keys and INTEROP_* env aliases).
// Wrappers consume only subsets; unset fields MUST be ignored until implemented.

message TlsConfig {
  string version = 1;
  string cipher_suite = 2;
  string server_hostname = 3;
  int32 port = 4;
  bytes certificate = 5;
  bytes private_key = 6;

  repeated string supported_groups = 7;
  repeated string signature_schemes = 8;
  repeated string signature_schemes_cert = 9;
  repeated string alpn_protocols = 10;
  // SupportedVersions-style hints (distinct from LibraryMetadata.supported_versions caps).
  repeated string supported_versions = 11;
  reserved 12, 13; // formerly min_version / max_version (not used yet)
  repeated string psk_modes = 14;
  string ticket_cipher = 15;
  int64 ticket_lifetime = 16;
  int64 max_early_data = 17;
  bool enable_early_data = 18;
  bool prefer_server_ciphers = 19;
  bool use_encrypt_then_mac = 20;
  bool use_extended_master_secret = 21;
  bool require_extended_master_secret = 22;
  int32 record_size_limit = 23;
  string max_fragment_length = 24;
  bool session_tickets_enabled = 25;
  bool ocsp_stapling = 26;
  string renegotiation = 27;
  bool post_handshake_auth = 28;
  reserved 29, 30; // formerly verify_peer / verify_hostname
  string ca_file = 31;
  string ca_path = 32;
  string keylog_file = 33;
  repeated string certificate_compression_send = 34;
  repeated string certificate_compression_receive = 35;
  // Driver-only: "save" | "resume" for TLS 1.3 session ticket / 0-RTT orchestration.
  string resumption_step = 36;
  // Writable repo root inside the wrapper process (host path in local mode, /app in Compose).
  string repo_root = 37;
}

message OperationRequest {
  enum OpType {
    ESTABLISH = 0;
    TRANSMIT = 1;
    KEY_UPDATE = 2;
    CLOSE = 3;
  }
  OpType type = 1;
  Role role = 2;
  bytes payload = 3;
  TlsConfig config = 4;
}

// Best-effort TLS parameters observed from backend CLI output after handshake.
message NegotiatedTlsParameters {
  string protocol_version = 1;
  string cipher_suite = 2;
  string named_group = 3;
}

message OperationResponse {
  enum Status {
    SUCCESS = 0;
    FAILURE = 1;
    ERROR = 2;
  }
  Status status = 1;
  string message = 2;
  bytes output_data = 3;
  string logs = 4;
  NegotiatedTlsParameters negotiated = 5;
}

// --- gRPC service ---

service TlsInteropWrapper {
  rpc GetMetadata(Empty) returns (LibraryMetadata);
  rpc ExecuteOperation(OperationRequest) returns (OperationResponse);
}

message Empty {}
