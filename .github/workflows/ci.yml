name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [openssl, gnutls, nss]
        client: [openssl, gnutls, nss]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependency for CLI
        run: |
          python -m pip install --upgrade pip
          pip install 'protobuf>=4.21' 'PyYAML>=6.0'

      - name: Run interop pair
        run: python3 src/main.py --server "${{ matrix.server }}" --client "${{ matrix.client }}"
