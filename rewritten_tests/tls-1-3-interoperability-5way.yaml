  # gnutls server, openssl client
  - server: gnutls
    client: openssl
    cipher_suite: aes-128-gcm
    signature_schemes: rsa-pss-rsae-sha256
  # openssl server, gnutls client
  - server: openssl
    client: gnutls
    cipher_suite: aes-128-gcm
    signature_schemes: rsa-pss-rsae-sha256
