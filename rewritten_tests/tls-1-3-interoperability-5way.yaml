# TLS 1.3 interoperability (gnutls-openssl + nss-openssl merged).
# From OpenSSL Beaker Interoperability; each block = both role directions.
#
# Sources:
#   - openssl/Interoperability/tls-1-3-interoperability-gnutls-openssl-5way/5way.csv
#   - openssl/Interoperability/tls-1-3-interoperability-nss-openssl-5way/5way.csv
#   python3 src/main.py --suite scenarios/rewritten/openssl-interop/tls-1-3-interoperability-5way.yaml

matrix:
  tls_version: 1.3

cases:
  # [gnutls×openssl] cert=rsa c_name=TLS_AES_128_GCM_SHA256 c_sig=default g_name=default HRR=false resume=true k_update=true k_update not wired
  # gnutls server, openssl client
  - server: gnutls
    client: openssl
    cipher_suite: aes-128-gcm
    test_features: resumption
  # openssl server, gnutls client
  - server: openssl
    client: gnutls
    cipher_suite: aes-128-gcm
    test_features: resumption
