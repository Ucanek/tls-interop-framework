syntax = "proto3";

package tls.interop;

// Test role (client or server)
enum Role {
  ROLE_UNSPECIFIED = 0;
  CLIENT = 1;
  SERVER = 2;
}

// Capability filter flags
enum ModifyFlag {
  UNSUPPORTED = 0;
  READ = 1;
  SET = 2;
  NEGOTIATE = 4;
}

// --- Dispatcher / capability messages ---

message Capability {
  string name = 1;
  repeated ModifyFlag flags = 2;
}

message LibraryMetadata {
  string component_name = 1;
  string version = 2;
  repeated Role roles = 3;
  repeated Capability supported_versions = 4;
  repeated Capability cipher_suites = 5;
  repeated Capability groups = 6;
}

// --- Coordinator / operation messages ---
//
// TlsConfig aligns with CLI catalog ids (capabilities.json keys and INTEROP_* env aliases).
// Wrappers consume only subsets; unset fields MUST be ignored until implemented.

message TlsConfig {
  string version = 1;
  string cipher_suite = 2;
  string server_hostname = 3;
  int32 port = 4;
  bytes certificate = 5;
  bytes private_key = 6;

  repeated string supported_groups = 7;
  repeated string signature_schemes = 8;
  repeated string signature_schemes_cert = 9;
  repeated string alpn_protocols = 10;
  // test_features tokens mirrored for wrappers (psk, anonymous, resumption, 0rtt, mtls, …).
  repeated string psk_modes = 14;
  // Driver-only: "save" | "resume" for TLS 1.3 session ticket / 0-RTT orchestration.
  string resumption_step = 36;
  // Writable repo root inside the wrapper process (host repository path).
  string repo_root = 37;
  // Driver: require Hello Retry Request during handshake (assert via negotiated.hrr_occurred).
  bool expect_hrr = 38;

  // Retired unused fields (re-add later with a new number if needed).
  reserved 11 to 13, 15 to 35;
  reserved "supported_versions", "ticket_cipher", "ticket_lifetime", "max_early_data",
           "enable_early_data", "prefer_server_ciphers", "use_encrypt_then_mac",
           "use_extended_master_secret", "require_extended_master_secret",
           "record_size_limit", "max_fragment_length", "session_tickets_enabled",
           "ocsp_stapling", "renegotiation", "post_handshake_auth", "ca_file", "ca_path",
           "certificate_compression_send", "certificate_compression_receive";
}

message OperationRequest {
  enum OpType {
    ESTABLISH = 0;
    TRANSMIT = 1;
    KEY_UPDATE = 2;
    CLOSE = 3;
  }
  OpType type = 1;
  Role role = 2;
  bytes payload = 3;
  TlsConfig config = 4;
}

// Best-effort TLS parameters observed from backend CLI output after handshake.
message NegotiatedTlsParameters {
  string protocol_version = 1;
  string cipher_suite = 2;
  string named_group = 3;
  bool hrr_occurred = 4;
}

message OperationResponse {
  enum Status {
    SUCCESS = 0;
    FAILURE = 1;
    ERROR = 2;
  }
  Status status = 1;
  string message = 2;
  bytes output_data = 3;
  string logs = 4;
  NegotiatedTlsParameters negotiated = 5;
}

// --- gRPC service ---

service TlsInteropWrapper {
  rpc GetMetadata(Empty) returns (LibraryMetadata);
  rpc ExecuteOperation(OperationRequest) returns (OperationResponse);
}

message Empty {}
