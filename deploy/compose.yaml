# Used by ``python3 src/main.py`` (writes deploy/.interop.env before ``compose run driver``).
# SERVER_WRAPPER / CLIENT_WRAPPER select wrapper_<name>.py; ``driver`` loads vars from deploy/.interop.env.

services:
  server_node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tls-interop-wrapper
    environment:
      WRAPPER: ${SERVER_WRAPPER:-openssl}
      GRPC_PORT: "50051"
      NSSDB: /app/nssdb
      INTEROP_GNUTLS_NSS_PAIR: ${INTEROP_GNUTLS_NSS_PAIR:-0}
    command: ["python3", "/app/wrapper_entry.py"]

  client_node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tls-interop-wrapper
    environment:
      WRAPPER: ${CLIENT_WRAPPER:-openssl}
      GRPC_PORT: "50051"
      NSSDB: /app/nssdb
      INTEROP_GNUTLS_NSS_PAIR: ${INTEROP_GNUTLS_NSS_PAIR:-0}
    command: ["python3", "/app/wrapper_entry.py"]

  driver:
    image: tls-interop-wrapper
    depends_on:
      - server_node
      - client_node
    # INTEROP_* / TLS_* via ``driver.env_file``: ``main.py`` merges a temporary overlay (-f …) pointing at an env path (parallel matrices use unique paths).
    command: ["python3", "-m", "core.runner"]
