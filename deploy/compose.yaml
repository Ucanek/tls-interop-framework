# Compose file for interop runtime (selected by src/main.py).
#
# Wrapper names come from deploy/wrappers.json via:
#   SERVER_WRAPPER=openssl|gnutls|nss
#   CLIENT_WRAPPER=openssl|gnutls|nss

services:
  server_node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tls-interop-wrapper
    environment:
      WRAPPER: ${SERVER_WRAPPER:-openssl}
      NSSDB: /app/nssdb
      INTEROP_GNUTLS_NSS_PAIR: ${INTEROP_GNUTLS_NSS_PAIR:-0}
    command: ["python3", "/app/wrapper_entry.py"]

  client_node:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tls-interop-wrapper
    environment:
      WRAPPER: ${CLIENT_WRAPPER:-openssl}
      GRPC_PORT: "50051"
      NSSDB: /app/nssdb
      INTEROP_GNUTLS_NSS_PAIR: ${INTEROP_GNUTLS_NSS_PAIR:-0}
    command: ["python3", "/app/wrapper_entry.py"]

  driver:
    image: tls-interop-wrapper
    depends_on:
      - server_node
      - client_node
    environment:
      TLS_SERVER_GRPC: "server_node:50051"
      TLS_CLIENT_GRPC: "client_node:50051"
      TLS_HOSTNAME: "server_node"
      INTEROP_VERBOSE: ${INTEROP_VERBOSE:-0}
      INTEROP_SCENARIO: ${INTEROP_SCENARIO:-}
      INTEROP_TLS_VERSION: ${INTEROP_TLS_VERSION:-}
      INTEROP_CIPHER_SUITE: ${INTEROP_CIPHER_SUITE:-}
      INTEROP_TLS_PORT: ${INTEROP_TLS_PORT:-0}
      INTEROP_TLS_HOSTNAME: ${INTEROP_TLS_HOSTNAME:-}
    command: ["sh", "-c", "sleep 5 && PYTHONPATH=/app python3 driver.py"]
