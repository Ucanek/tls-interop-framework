# Persistent wrapper services (one container per TLS backend).
# Host orchestrator: ``docker compose up -d <backend>`` then gRPC from ``src/main.py``.

services:
  openssl:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tls-interop-wrapper
    volumes:
      - ../certs:/app/certs:ro
    environment:
      WRAPPER: openssl
      GRPC_PORT: "50051"
    ports:
      - "127.0.0.1:15051:50051"
      - "127.0.0.1:15551:5555"
    command: ["python3", "/app/wrapper_entry.py"]

  gnutls:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tls-interop-wrapper
    volumes:
      - ../certs:/app/certs:ro
    environment:
      WRAPPER: gnutls
      GRPC_PORT: "50051"
    ports:
      - "127.0.0.1:15052:50051"
      - "127.0.0.1:15552:5555"
    command: ["python3", "/app/wrapper_entry.py"]

  nss:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tls-interop-wrapper
    volumes:
      - ../certs:/app/certs:ro
    environment:
      WRAPPER: nss
      GRPC_PORT: "50051"
      NSSDB: /app/wrappers/nss/nssdb/nss
      INTEROP_GNUTLS_NSS_PAIR: ${INTEROP_GNUTLS_NSS_PAIR:-0}
    ports:
      - "127.0.0.1:15053:50051"
      - "127.0.0.1:15553:5555"
    command: ["python3", "/app/wrapper_entry.py"]
